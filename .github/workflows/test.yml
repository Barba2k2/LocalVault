name: Test

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run tests
        run: >-
          xcodebuild test
          -project LocalVault.xcodeproj
          -scheme LocalVault
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          CODE_SIGNING_REQUIRED=NO
