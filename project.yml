name: LocalVault
options:
  bundleIdPrefix: com.barba
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    INDENT_WIDTH: 2
    TAB_WIDTH: 2
    USE_TABS: NO
targets:
  LocalVault:
    type: application
    platform: iOS
    sources:
      - path: LocalVault
        type: group
    resources:
      - path: LocalVault/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barba.localvault
        PRODUCT_NAME: LocalVault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: LocalVault/LocalVault.entitlements
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - LocalVaultTests
  LocalVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LocalVaultTests
    dependencies:
      - target: LocalVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barba.localvault.tests
        GENERATE_INFOPLIST_FILE: YES
  LocalVaultAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: LocalVault/Domain
      - path: LocalVault/Infrastructure
        excludes:
          - ClipboardManager.swift
          - CredentialIdentityStoreIndex.swift
          - VaultLockController.swift
      - path: LocalVaultAutoFill
        excludes:
          - Info.plist
          - LocalVaultAutoFill.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barba.localvault.autofill
        PRODUCT_NAME: LocalVaultAutoFill
        INFOPLIST_FILE: LocalVaultAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocalVaultAutoFill/LocalVaultAutoFill.entitlements
  LocalVaultMac:
    type: application
    platform: macOS
    sources:
      - path: LocalVault/Domain
      - path: LocalVault/Application
      - path: LocalVault/ContentView.swift
      - path: LocalVault/Infrastructure
        excludes:
          - ClipboardManager.swift
          - CredentialIdentityStoreIndex.swift
      - path: LocalVault/Presentation
      - path: LocalVaultMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barba.localvault.macos
        PRODUCT_NAME: LocalVault
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: LocalVaultMac/LocalVaultMac.entitlements
        GENERATE_INFOPLIST_FILE: YES
  LocalVaultMacAutoFill:
    type: app-extension
    platform: macOS
    sources:
      - path: LocalVault/Domain
      - path: LocalVault/Infrastructure
        excludes:
          - ClipboardManager.swift
          - LocalAuthenticationAuthenticator.swift
          - CredentialIdentityStoreIndex.swift
          - VaultLockController.swift
      - path: LocalVaultMacAutoFill
        excludes:
          - Info.plist
          - LocalVaultMacAutoFill.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barba.localvault.macos.autofill
        PRODUCT_NAME: LocalVaultMacAutoFill
        INFOPLIST_FILE: LocalVaultMacAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: LocalVaultMacAutoFill/LocalVaultMacAutoFill.entitlements
