name: LocalVault
options:
  bundleIdPrefix: com.barba
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    INDENT_WIDTH: 2
    TAB_WIDTH: 2
    USE_TABS: NO
targets:
  LocalVault:
    type: application
    platform: macOS
    sources:
      - path: LocalVault
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barba.localvault
        PRODUCT_NAME: LocalVault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - LocalVaultTests
  LocalVaultTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LocalVaultTests
    dependencies:
      - target: LocalVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barba.localvault.tests
        GENERATE_INFOPLIST_FILE: YES
